name: CI

on:
  push:
    # prerelease.yml runs these checks for main before it publishes a prerelease
    branches-ignore: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tmux for the tests of internal/tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      - run: task check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task test:e2e
